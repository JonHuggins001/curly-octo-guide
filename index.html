    <style>
  #chat-btn {
    position: fixed; bottom: 28px; right: 28px;
    background: #1c2333; color: #00b4b4; border: 1px solid #00b4b4;
    border-radius: 50px; padding: 12px 20px;
    font-size: 15px; cursor: pointer; z-index: 9999;
    font-family: "Courier New", monospace;
    letter-spacing: 0.1em;
    transition: all 0.2s ease;
}
  
  #chat-btn:hover {
    background-color: #00b4b4;
    color: #0d0d0f;
    box-shadow: 
        0 0 8px #18ffff,
        0 0 16px #00e5ff;
    transform: scale(1.05);
}
  #chat-panel {
    position: fixed; bottom: 90px; right: 28px;
    width: 340px; height: 480px;
    background: #fff; border-radius: 16px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    display: none; flex-direction: column;
    font-family: system-ui, sans-serif; z-index: 9999;
    overflow: hidden; border: 1px solid #e5e7eb;
  }
  #chat-panel.open { display: flex; }
  #chat-header {
    background: #1a1a2e; color: #fff;
    padding: 14px 18px; font-weight: 600; font-size: 15px;
  }
  #chat-messages {
    flex: 1; overflow-y: auto; padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
  .msg.user { background: #1a1a2e; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.bot  { background: #f3f4f6; color: #111; align-self: flex-start; border-bottom-left-radius: 4px; }
  #chat-input-row { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid #e5e7eb; }
  #chat-input {
    flex: 1; border: 1px solid #d1d5db; border-radius: 8px;
    padding: 8px 12px; font-size: 14px; outline: none;
  }
  #chat-send {
    background: #1a1a2e; color: #fff; border: none;
    border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 14px;
  }
</style>

<button id="chat-btn" onclick="toggleChat()">🤖 Ask Jonbot</button>

<div id="chat-panel">
  <div id="chat-header">Ask me anything</div>
  <div id="chat-messages">
    <div class="msg bot">Hi! I'm Jonbot. Feel free to ask me any questions about Jon.</div>
  </div>
  <div id="chat-input-row">
    <input id="chat-input" type="text" placeholder="Type a message…" onkeydown="if(event.key==='Enter') sendMsg()" />
    <button id="chat-send" onclick="sendMsg()">Send</button>
  </div>
</div>

<script>
  const SYSTEM_PROMPT = `You are a helpful assistant on a developer portfolio website. Answer questions about their work, skills, and projects. Be friendly and concise.`;

  const history = [];

  function toggleChat() {
    document.getElementById('chat-panel').classList.toggle('open');
  }

  async function sendMsg() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';

    addMessage(text, 'user');
    history.push({ role: 'user', content: text });

    const thinking = addMessage('…', 'bot');

    try {
      const res = await fetch('https://chat.jonhuggins.nz', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'deepseek-chat',
          messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...history]
        })
      });
      const data = await res.json();
      console.log(data);
      const reply = data.choices[0].message.content;
      history.push({ role: 'assistant', content: reply });
      thinking.textContent = reply;
    } catch (e) {
      thinking.textContent = e.message;
    }
  }

  function addMessage(text, who) {
    const el = document.createElement('div');
    el.className = `msg ${who}`;
    el.textContent = text;
    const msgs = document.getElementById('chat-messages');
    msgs.appendChild(el);
    msgs.scrollTop = msgs.scrollHeight;
    return el;
  }
</script>
